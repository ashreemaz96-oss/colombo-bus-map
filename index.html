<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#101c3c">

  <title>Colombo Bus Watch</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
  >

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    :root {
      --header-height: 62px;

      --navy: #101c3c;
      --panel: #142347;
      --panel-dark: rgba(10, 20, 43, 0.94);
      --border: #294066;

      --text: #f8fafc;
      --subtext: #a9b7cf;

      --pink: #ff315c;
      --orange: #ffad0d;
      --cyan: #00d9ff;
      --purple: #c63cff;
      --blue: #1478ff;
      --green: #20df75;

      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--navy);
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
      overscroll-behavior: none;
    }

    button,
    input {
      font: inherit;
    }

    button {
      touch-action: manipulation;
    }

    /* =========================================================
       HEADER
    ========================================================= */

    #header {
      position: relative;
      z-index: 2000;

      width: 100%;
      height: calc(var(--header-height) + var(--safe-top));

      padding:
        var(--safe-top)
        max(14px, var(--safe-right))
        0
        max(14px, var(--safe-left));

      display: grid;
      grid-template-columns: minmax(200px, 1fr) auto auto;
      align-items: center;
      gap: 14px;

      background: var(--navy);
      border-bottom: 2px solid var(--pink);
      box-shadow: 0 3px 14px rgba(0, 0, 0, 0.3);
    }

    .brand {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      font-size: 1.45rem;
      flex-shrink: 0;
    }

    .brand-text {
      min-width: 0;
    }

    .brand h1 {
      color: #ffffff;
      font-size: 1.04rem;
      line-height: 1.15;
      font-weight: 800;
      white-space: nowrap;
    }

    .brand p {
      margin-top: 3px;
      color: #8fa5c7;
      font-size: 0.72rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #datetime-panel {
      min-width: 205px;
      padding: 6px 13px;

      border: 1px solid rgba(0, 217, 255, 0.36);
      border-radius: 10px;

      background: rgba(0, 217, 255, 0.08);
      text-align: center;
    }

    #sl-time {
      color: var(--cyan);
      font-size: 0.9rem;
      line-height: 1.15;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    #sl-date {
      margin-top: 3px;
      color: var(--subtext);
      font-size: 0.66rem;
      line-height: 1.15;
      white-space: nowrap;
    }

    .header-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 9px;
    }

    .header-button {
      min-height: 38px;
      padding: 8px 16px;

      border-radius: 9px;
      border: 1px solid transparent;

      color: #ffffff;
      font-size: 0.82rem;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;

      transition:
        transform 0.15s ease,
        background 0.15s ease,
        opacity 0.15s ease;
    }

    .header-button:active {
      transform: scale(0.97);
    }

    .header-button:disabled {
      cursor: wait;
      opacity: 0.7;
    }

    #locate-button {
      color: var(--cyan);
      background: rgba(0, 217, 255, 0.1);
      border-color: rgba(0, 217, 255, 0.28);
    }

    #locate-button:hover {
      background: rgba(0, 217, 255, 0.18);
    }

    #report-button {
      background: var(--pink);
      border-color: var(--pink);
    }

    #report-button:hover {
      background: #e92850;
    }

    /* =========================================================
       MAP
    ========================================================= */

    #map {
      width: 100%;
      height: calc(100dvh - var(--header-height) - var(--safe-top));
      min-height: 320px;
      background: #cad7df;
    }

    .leaflet-container {
      font-family: "Segoe UI", Arial, sans-serif;
      touch-action: pan-x pan-y;
    }

    .leaflet-control-zoom {
      border: 0 !important;
      box-shadow: 0 5px 16px rgba(0, 0, 0, 0.28) !important;
    }

    .leaflet-control-zoom a {
      width: 38px !important;
      height: 38px !important;
      line-height: 38px !important;
      font-size: 1.25rem !important;
      color: #17213a !important;
    }

    /* =========================================================
       LIVE REFRESH PANEL
    ========================================================= */

    #refresh-panel {
      position: absolute;
      z-index: 1200;
      top: calc(var(--header-height) + var(--safe-top) + 10px);
      right: max(14px, var(--safe-right));

      min-height: 32px;
      padding: 6px 11px;

      display: flex;
      align-items: center;
      gap: 7px;

      border: 1px solid var(--border);
      border-radius: 20px;

      color: var(--subtext);
      background: var(--panel-dark);

      font-size: 0.73rem;
      cursor: pointer;

      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    #refresh-panel:hover {
      color: #ffffff;
      border-color: var(--cyan);
    }

    .live-dot {
      width: 8px;
      height: 8px;
      flex-shrink: 0;

      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px rgba(32, 223, 117, 0.75);
    }

    .live-dot.loading {
      background: var(--orange);
      box-shadow: 0 0 8px rgba(255, 173, 13, 0.7);
      animation: blink 0.7s infinite;
    }

    #refresh-countdown {
      min-width: 24px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    @keyframes blink {
      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.25;
      }
    }

    /* =========================================================
       FILTER MESSAGE
    ========================================================= */

    #filter-message {
      position: absolute;
      z-index: 1200;
      top: calc(var(--header-height) + var(--safe-top) + 10px);
      left: 50%;

      max-width: calc(100vw - 330px);
      min-height: 32px;
      padding: 6px 12px;

      display: none;
      align-items: center;
      gap: 9px;

      transform: translateX(-50%);

      border: 1px solid var(--border);
      border-radius: 20px;

      color: #ffffff;
      background: var(--panel-dark);

      font-size: 0.75rem;
      white-space: nowrap;

      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    #filter-message.visible {
      display: flex;
    }

    #filter-message-text {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #clear-filter-button {
      border: 0;
      color: var(--subtext);
      background: transparent;
      font-size: 1rem;
      line-height: 1;
      cursor: pointer;
    }

    #clear-filter-button:hover {
      color: var(--pink);
    }

    /* =========================================================
       LIVE REPORT STATISTICS
    ========================================================= */

    #statistics-panel {
      position: absolute;
      z-index: 1250;
      left: 50%;
      bottom: calc(18px + var(--safe-bottom));

      display: flex;
      align-items: stretch;
      justify-content: center;
      gap: 8px;

      transform: translateX(-50%);
    }

    .stat-card {
      width: 84px;
      min-height: 84px;
      padding: 10px 8px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      border: 2px solid var(--border);
      border-radius: 13px;

      color: #ffffff;
      background: rgba(10, 20, 43, 0.94);

      text-align: center;
      cursor: pointer;
      user-select: none;

      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      transition:
        transform 0.16s ease,
        border-color 0.16s ease,
        background 0.16s ease;
    }

    .stat-card:hover {
      transform: translateY(-3px);
    }

    .stat-card.active {
      transform: translateY(-5px);
    }

    .stat-number {
      font-size: 1.5rem;
      line-height: 1;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }

    .stat-label {
      margin-top: 6px;
      color: var(--subtext);
      font-size: 0.66rem;
      line-height: 1.2;
    }

    .stat-card[data-type="all"] {
      border-color: rgba(255, 49, 92, 0.5);
    }

    .stat-card[data-type="all"] .stat-number {
      color: var(--pink);
    }

    .stat-card[data-type="all"].active {
      border-color: var(--pink);
      background: rgba(255, 49, 92, 0.14);
    }

    .stat-card[data-type="Overcrowding"] {
      border-color: rgba(255, 49, 92, 0.5);
    }

    .stat-card[data-type="Overcrowding"] .stat-number {
      color: var(--pink);
    }

    .stat-card[data-type="Overcrowding"].active {
      border-color: var(--pink);
      background: rgba(255, 49, 92, 0.14);
    }

    .stat-card[data-type="Delay"] {
      border-color: rgba(255, 173, 13, 0.5);
    }

    .stat-card[data-type="Delay"] .stat-number {
      color: var(--orange);
    }

    .stat-card[data-type="Delay"].active {
      border-color: var(--orange);
      background: rgba(255, 173, 13, 0.14);
    }

    .stat-card[data-type="Misconduct"] {
      border-color: rgba(198, 60, 255, 0.5);
    }

    .stat-card[data-type="Misconduct"] .stat-number {
      color: var(--purple);
    }

    .stat-card[data-type="Misconduct"].active {
      border-color: var(--purple);
      background: rgba(198, 60, 255, 0.14);
    }

    .stat-card[data-type="Lost Item"] {
      border-color: rgba(0, 217, 255, 0.5);
    }

    .stat-card[data-type="Lost Item"] .stat-number {
      color: var(--cyan);
    }

    .stat-card[data-type="Lost Item"].active {
      border-color: var(--cyan);
      background: rgba(0, 217, 255, 0.14);
    }

    /* =========================================================
       MAP CONTROLS
    ========================================================= */

    .map-panel {
      min-width: 165px;
      padding: 13px 14px;

      border: 1px solid var(--border);
      border-radius: 12px;

      color: var(--text);
      background: var(--panel-dark);

      font-size: 0.78rem;
      line-height: 1.4;

      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .map-panel-title {
      margin-bottom: 10px;
      color: var(--pink);
      font-size: 0.78rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .layer-row,
    .legend-row {
      min-height: 24px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .layer-row {
      cursor: pointer;
    }

    .layer-row input {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
      accent-color: var(--pink);
    }

    .panel-separator {
      height: 1px;
      margin: 8px 0;
      border: 0;
      background: var(--border);
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      flex-shrink: 0;

      border: 2px solid #ffffff;
      border-radius: 50%;
    }

    .legend-user-dot {
      background: var(--blue);
    }

    .legend-stop-dot {
      background: var(--cyan);
    }

    /* =========================================================
       REPORT MARKERS
    ========================================================= */

    .report-marker-wrap {
      background: transparent;
      border: 0;
    }

    .report-marker {
      width: 22px;
      height: 22px;

      display: grid;
      place-items: center;

      border: 3px solid #ffffff;
      border-radius: 50%;

      box-shadow:
        0 0 0 2px rgba(10, 20, 43, 0.42),
        0 3px 10px rgba(0, 0, 0, 0.55);

      transform-origin: center;
      transition: transform 0.15s ease;
    }

    .report-marker::after {
      content: "";
      width: 6px;
      height: 6px;

      border-radius: 50%;
      background: rgba(255, 255, 255, 0.95);
    }

    .report-marker-wrap:hover .report-marker {
      transform: scale(1.24);
    }

    .report-marker.overcrowding {
      background: var(--pink);
    }

    .report-marker.delay {
      background: var(--orange);
    }

    .report-marker.lost-item {
      background: var(--cyan);
    }

    .report-marker.misconduct {
      background: var(--purple);
    }

    .bus-stop-marker {
      width: 12px;
      height: 12px;

      border: 2px solid #ffffff;
      border-radius: 50%;

      background: #00bde3;
      box-shadow:
        0 0 0 1px rgba(0, 72, 95, 0.55),
        0 2px 5px rgba(0, 0, 0, 0.35);
    }

    /* =========================================================
       USER LOCATION
    ========================================================= */

    .user-location-marker {
      position: relative;
      width: 22px;
      height: 22px;
    }

    .user-location-dot {
      position: absolute;
      z-index: 2;
      top: 50%;
      left: 50%;

      width: 16px;
      height: 16px;

      transform: translate(-50%, -50%);

      border: 3px solid #ffffff;
      border-radius: 50%;

      background: var(--blue);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
    }

    .user-location-pulse {
      position: absolute;
      z-index: 1;
      top: 50%;
      left: 50%;

      width: 42px;
      height: 42px;

      transform: translate(-50%, -50%);

      border-radius: 50%;
      background: rgba(20, 120, 255, 0.25);

      animation: locationPulse 2s ease-out infinite;
    }

    @keyframes locationPulse {
      0% {
        transform: translate(-50%, -50%) scale(0.45);
        opacity: 1;
      }

      100% {
        transform: translate(-50%, -50%) scale(1.75);
        opacity: 0;
      }
    }

    /* =========================================================
       POPUPS
    ========================================================= */

    .leaflet-popup-content-wrapper {
      overflow: hidden;

      border: 1px solid var(--border);
      border-radius: 14px;

      color: var(--text);
      background: var(--panel);

      box-shadow: 0 9px 30px rgba(0, 0, 0, 0.48);
    }

    .leaflet-popup-tip {
      background: var(--panel);
    }

    .leaflet-popup-content {
      width: 250px !important;
      max-width: 250px;
      margin: 0;
    }

    .leaflet-popup-close-button {
      top: 8px !important;
      right: 8px !important;

      width: 28px !important;
      height: 28px !important;

      color: #ffffff !important;
      font-size: 1.3rem !important;
      line-height: 26px !important;
    }

    .report-popup {
      overflow: hidden;
      border-radius: 13px;
    }

    .report-popup-header {
      padding: 13px 38px 12px 14px;

      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 900;
    }

    .report-popup-body {
      padding: 12px 14px 14px;
    }

    .popup-primary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      margin-bottom: 10px;
    }

    .popup-primary-box {
      min-width: 0;
      padding: 8px;

      border: 1px solid var(--border);
      border-radius: 9px;

      background: rgba(7, 15, 34, 0.5);
    }

    .popup-primary-label {
      color: var(--subtext);
      font-size: 0.62rem;
      text-transform: uppercase;
    }

    .popup-primary-value {
      margin-top: 3px;

      color: #ffffff;
      font-size: 0.88rem;
      font-weight: 900;

      overflow-wrap: anywhere;
    }

    .popup-row {
      margin-top: 6px;
      color: #e9eef7;
      font-size: 0.77rem;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .popup-label {
      color: var(--subtext);
    }

    .popup-time {
      margin-top: 10px;
      padding-top: 8px;

      border-top: 1px solid var(--border);

      color: var(--subtext);
      font-size: 0.69rem;
    }

    /* =========================================================
       LOADING AND TOAST
    ========================================================= */

    #loading-overlay {
      position: fixed;
      z-index: 4000;
      top: calc(var(--header-height) + var(--safe-top));
      right: 0;
      bottom: 0;
      left: 0;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;

      color: var(--subtext);
      background: rgba(10, 20, 43, 0.72);

      transition: opacity 0.35s ease;
    }

    #loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 40px;
      height: 40px;

      border: 4px solid rgba(255, 49, 92, 0.2);
      border-top-color: var(--pink);
      border-radius: 50%;

      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    #loading-overlay p {
      font-size: 0.83rem;
    }

    #toast {
      position: fixed;
      z-index: 5000;
      left: 50%;
      bottom: calc(122px + var(--safe-bottom));

      max-width: calc(100vw - 28px);
      padding: 10px 17px;

      transform: translate(-50%, 28px);

      border: 1px solid var(--border);
      border-radius: 10px;

      color: #ffffff;
      background: var(--panel-dark);

      font-size: 0.79rem;
      text-align: center;

      opacity: 0;
      pointer-events: none;

      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.34);

      transition:
        opacity 0.25s ease,
        transform 0.25s ease;
    }

    #toast.visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* =========================================================
       TABLET
    ========================================================= */

    @media (max-width: 900px) {
      #header {
        grid-template-columns: minmax(180px, 1fr) auto;
      }

      #datetime-panel {
        display: none;
      }

      .map-panel {
        min-width: 150px;
        padding: 11px 12px;
      }
    }

    /* =========================================================
       MOBILE PORTRAIT
    ========================================================= */

    @media (max-width: 650px) {
      :root {
        --header-height: 104px;
      }

      #header {
        grid-template-columns: minmax(0, 1fr) auto;
        grid-template-rows: 52px 44px;
        gap: 0 8px;

        padding:
          var(--safe-top)
          max(8px, var(--safe-right))
          0
          max(8px, var(--safe-left));
      }

      .brand {
        grid-column: 1;
        grid-row: 1;
      }

      .brand-icon {
        font-size: 1.25rem;
      }

      .brand h1 {
        font-size: 0.88rem;
      }

      .brand p {
        display: none;
      }

      .header-actions {
        grid-column: 2;
        grid-row: 1;
        gap: 5px;
      }

      .header-button {
        min-height: 34px;
        padding: 7px 9px;
        border-radius: 8px;
        font-size: 0.69rem;
      }

      #locate-button .full-label {
        display: none;
      }

      #datetime-panel {
        grid-column: 1 / 3;
        grid-row: 2;

        width: 100%;
        min-width: 0;
        height: 36px;
        padding: 5px 9px;

        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      #sl-time {
        font-size: 0.76rem;
      }

      #sl-date {
        margin-top: 0;
        font-size: 0.61rem;
      }

      #refresh-panel {
        top: calc(var(--header-height) + var(--safe-top) + 8px);
        right: max(7px, var(--safe-right));
        min-height: 30px;
        padding: 5px 8px;
        font-size: 0.66rem;
      }

      #filter-message {
        top: calc(var(--header-height) + var(--safe-top) + 8px);
        left: 8px;

        max-width: calc(100vw - 126px);
        min-height: 30px;
        padding: 5px 10px;

        transform: none;
        font-size: 0.68rem;
      }

      #statistics-panel {
        right: max(6px, var(--safe-right));
        bottom: calc(7px + var(--safe-bottom));
        left: max(6px, var(--safe-left));

        justify-content: flex-start;
        gap: 5px;

        padding: 1px 0 3px;

        transform: none;

        overflow-x: auto;
        overflow-y: hidden;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }

      #statistics-panel::-webkit-scrollbar {
        display: none;
      }

      .stat-card {
        width: 70px;
        min-width: 70px;
        min-height: 68px;
        padding: 7px 5px;
        border-radius: 10px;
      }

      .stat-card:hover,
      .stat-card.active {
        transform: none;
      }

      .stat-number {
        font-size: 1.16rem;
      }

      .stat-label {
        margin-top: 4px;
        font-size: 0.57rem;
      }

      .leaflet-top.leaflet-left {
        top: 40px;
      }

      .leaflet-top.leaflet-right {
        top: 42px;
      }

      .leaflet-control-zoom {
        margin-left: 8px !important;
      }

      .leaflet-control-zoom a {
        width: 36px !important;
        height: 36px !important;
        line-height: 36px !important;
      }

      .filter-control-container {
        display: none;
      }

      .legend-control-container {
        display: none;
      }

      .leaflet-popup-content {
        width: min(250px, calc(100vw - 44px)) !important;
        max-width: calc(100vw - 44px);
      }

      .popup-primary {
        grid-template-columns: 1fr;
      }

      .report-marker {
        width: 24px;
        height: 24px;
      }

      #toast {
        bottom: calc(92px + var(--safe-bottom));
        font-size: 0.73rem;
      }
    }

    /* =========================================================
       SMALL MOBILE
    ========================================================= */

    @media (max-width: 370px) {
      .brand h1 {
        font-size: 0.8rem;
      }

      .header-button {
        padding: 7px;
        font-size: 0.64rem;
      }

      #sl-time {
        font-size: 0.7rem;
      }

      #sl-date {
        font-size: 0.56rem;
      }

      .stat-card {
        width: 64px;
        min-width: 64px;
      }
    }

    /* =========================================================
       MOBILE LANDSCAPE
    ========================================================= */

    @media (orientation: landscape) and (max-height: 560px) {
      :root {
        --header-height: 54px;
      }

      #header {
        grid-template-columns: minmax(170px, 1fr) auto;
        grid-template-rows: 54px;

        padding:
          var(--safe-top)
          max(8px, var(--safe-right))
          0
          max(8px, var(--safe-left));
      }

      .brand,
      .header-actions {
        grid-row: 1;
      }

      .brand {
        grid-column: 1;
      }

      .header-actions {
        grid-column: 2;
      }

      #datetime-panel {
        display: none;
      }

      #statistics-panel {
        right: auto;
        left: 50%;
        bottom: calc(5px + var(--safe-bottom));

        max-width: 76vw;

        transform: translateX(-50%);
      }

      .stat-card {
        min-height: 58px;
      }

      .stat-label {
        display: none;
      }

      .leaflet-top.leaflet-left {
        top: 0;
      }

      #refresh-panel {
        top: calc(var(--header-height) + var(--safe-top) + 7px);
      }
    }
  </style>
</head>

<body>
  <header id="header">
    <div class="brand">
      <div class="brand-icon">🚌</div>

      <div class="brand-text">
        <h1>Colombo Bus Watch</h1>
        <p>CMC Area · Crowdsourced Transport Reports</p>
      </div>
    </div>

    <div id="datetime-panel" aria-label="Sri Lanka live date and time">
      <div id="sl-time">--:--:-- SLST</div>
      <div id="sl-date">Loading Sri Lankan date</div>
    </div>

    <div class="header-actions">
      <button
        type="button"
        class="header-button"
        id="locate-button"
        onclick="locateUser()"
      >
        📍 <span class="full-label">My Location</span>
      </button>

      <button
        type="button"
        class="header-button"
        id="report-button"
        onclick="openReportForm()"
      >
        ＋ Report
      </button>
    </div>
  </header>

  <main id="map"></main>

  <button
    type="button"
    id="refresh-panel"
    onclick="manualRefresh()"
    title="Refresh reports now"
  >
    <span class="live-dot" id="live-dot"></span>
    <span id="refresh-label">Live</span>
    <span id="refresh-countdown">15s</span>
  </button>

  <div id="filter-message">
    <span id="filter-message-text">Showing all reports</span>

    <button
      type="button"
      id="clear-filter-button"
      onclick="filterReports('all')"
      aria-label="Clear report filter"
    >
      ✕
    </button>
  </div>

  <section id="statistics-panel" aria-label="Live report statistics">
    <button
      type="button"
      class="stat-card active"
      data-type="all"
      onclick="filterReports('all')"
    >
      <span class="stat-number" id="total-count">0</span>
      <span class="stat-label">All<br>Reports</span>
    </button>

    <button
      type="button"
      class="stat-card"
      data-type="Overcrowding"
      onclick="filterReports('Overcrowding')"
    >
      <span class="stat-number" id="overcrowding-count">0</span>
      <span class="stat-label">Over-<br>crowding</span>
    </button>

    <button
      type="button"
      class="stat-card"
      data-type="Delay"
      onclick="filterReports('Delay')"
    >
      <span class="stat-number" id="delay-count">0</span>
      <span class="stat-label">Delays</span>
    </button>

    <button
      type="button"
      class="stat-card"
      data-type="Misconduct"
      onclick="filterReports('Misconduct')"
    >
      <span class="stat-number" id="misconduct-count">0</span>
      <span class="stat-label">Mis-<br>conduct</span>
    </button>

    <button
      type="button"
      class="stat-card"
      data-type="Lost Item"
      onclick="filterReports('Lost Item')"
    >
      <span class="stat-number" id="lost-item-count">0</span>
      <span class="stat-label">Lost<br>Items</span>
    </button>
  </section>

  <div id="loading-overlay">
    <div class="spinner"></div>
    <p>Loading live reports...</p>
  </div>

  <div id="toast"></div>

  <script>
    /* =========================================================
       CONFIGURATION
    ========================================================= */

    const SHEET_CSV_URL =
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vRasFFahZ99QPZhYfeAgFIEw5mf5yievDY4JCd55WArORfjk_5NVFKjo50qoyI36PF1e4iUT7kKS0Hr/pub?output=csv";

    const GOOGLE_FORM_URL =
      "https://docs.google.com/forms/d/e/1FAIpQLSeGCGK3xjOS-F8s1BXwow29UaXNWmXQ3mWYUddt2apAiLO6ug/viewform?usp=preview";

const FORM_ENTRY_LATITUDE = "entry.683164263";
const FORM_ENTRY_LONGITUDE = "entry.788233062";

    const REFRESH_INTERVAL_SECONDS = 10;

    const COLOMBO_CENTRE = [6.9271, 79.8612];

    const COLUMN_ALIASES = {
      type: [
        "Type of Reporting",
        "Report Type",
        "Type of Report",
        "Reporting Type"
      ],

      route: [
        "Bus Route Number",
        "Route Number",
        "Bus route number",
        "Route No",
        "Route"
      ],

      busRegistration: [
        "Bus Registration Number",
        "Bus Register Number",
        "Bus Registration",
        "Vehicle Registration Number",
        "Vehicle Number",
        "Registration Number",
        "Registration No",
        "Bus Number"
      ],

      stop: [
        "Bus stop / Location name",
        "Bus Stop / Location Name",
        "Bus Stop",
        "Location Name",
        "Location",
        "Stop Name"
      ],

      crowding: [
        "Crowding Level",
        "Crowding level",
        "Level of Crowding"
      ],

      delay: [
        "Delay Duration (minutes)",
        "Delay duration (minutes)",
        "Delay Duration",
        "Delay Minutes"
      ],

      description: [
        "Issue Description",
        "Description",
        "Issue description",
        "Details"
      ],

      incidentTime: [
        "Time",
        "Time of Incident",
        "Incident Time",
        "Reported Time"
      ],

      timestamp: [
        "Timestamp",
        "Submission Time",
        "Submitted At"
      ],

      latitude: [
        "Latitude",
        "Lat"
      ],

      longitude: [
        "Longitude",
        "Lng",
        "Lon",
        "Long"
      ]
    };

    const REPORT_CONFIG = {
      Overcrowding: {
        colour: "#ff315c",
        className: "overcrowding"
      },

      Delay: {
        colour: "#ffad0d",
        className: "delay"
      },

      "Lost Item": {
        colour: "#00d9ff",
        className: "lost-item"
      },

      Misconduct: {
        colour: "#c63cff",
        className: "misconduct"
      }
    };

    /* =========================================================
       MAP INITIALISATION
    ========================================================= */

    const map = L.map("map", {
      zoomControl: false,
      preferCanvas: true,
      tap: true,
      zoomAnimation: true,
      fadeAnimation: true,
      markerZoomAnimation: true,
      inertia: true,
      inertiaDeceleration: 3000,
      worldCopyJump: false
    }).setView(COLOMBO_CENTRE, 13);

    L.control.zoom({
      position: "topleft"
    }).addTo(map);

    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        updateWhenIdle: true,
        keepBuffer: 3,
        attribution:
          '&copy; <a href="https://www.openstreetmap.org/">OpenStreetMap</a>'
      }
    ).addTo(map);

    /* =========================================================
       MAP LAYERS
    ========================================================= */

    const reportLayers = {
      Overcrowding: L.layerGroup().addTo(map),
      Delay: L.layerGroup().addTo(map),
      "Lost Item": L.layerGroup().addTo(map),
      Misconduct: L.layerGroup().addTo(map)
    };

    let busStopsLayer = null;
    let userLocationMarker = null;
    let userLocation = null;
    let activeFilter = "all";
    let refreshTimer = null;
    let refreshCountdown = REFRESH_INTERVAL_SECONDS;
    let toastTimer = null;
    let loadRequestNumber = 0;

    let reportCounts = {
      total: 0,
      Overcrowding: 0,
      Delay: 0,
      Misconduct: 0,
      "Lost Item": 0
    };

    const geocodeCache = new Map();

    /* =========================================================
       OPTIONAL GEOJSON LAYERS
    ========================================================= */

    loadGeoJsonLayer(
      "data/cmc_boundary.geojson",
      {
        style: {
          color: "#ff315c",
          weight: 2.3,
          opacity: 0.9,
          fillColor: "#ff315c",
          fillOpacity: 0.035,
          dashArray: "7 5"
        },
        interactive: false
      }
    );

    loadGeoJsonLayer(
      "data/road_network.geojson",
      {
        style: {
          color: "#23446d",
          weight: 1.2,
          opacity: 0.72
        },
        interactive: false
      }
    );

    loadBusStops();

    async function loadGeoJsonLayer(url, options) {
      try {
        const response = await fetch(url);

        if (!response.ok) {
          return;
        }

        const data = await response.json();
        L.geoJSON(data, options).addTo(map);
      } catch (error) {
        console.warn("Could not load:", url, error);
      }
    }

    async function loadBusStops() {
      try {
        const response = await fetch("data/bus_stops.geojson");

        if (!response.ok) {
          return;
        }

        const data = await response.json();

        const busStopIcon = L.divIcon({
          className: "",
          html: '<div class="bus-stop-marker"></div>',
          iconSize: [12, 12],
          iconAnchor: [6, 6],
          popupAnchor: [0, -8]
        });

        busStopsLayer = L.geoJSON(data, {
          pointToLayer(feature, latlng) {
            return L.marker(latlng, {
              icon: busStopIcon,
              keyboard: true
            });
          },

          onEachFeature(feature, layer) {
            const properties = feature.properties || {};

            const stopName =
              properties.name ||
              properties.Name ||
              properties.stop_name ||
              properties.Stop_Name ||
              "Bus Stop";

            layer.bindPopup(
              '<div style="padding:12px 14px;color:#ffffff">' +
                '<strong style="color:#00d9ff">🚏 ' +
                escapeHtml(stopName) +
                "</strong>" +
              "</div>"
            );
          }
        }).addTo(map);
      } catch (error) {
        console.warn("Bus stops could not be loaded.", error);
      }
    }

    /* =========================================================
       SRI LANKA LIVE DATE AND TIME
    ========================================================= */

    function updateSriLankaDateTime() {
      const now = new Date();

      const timeText = new Intl.DateTimeFormat("en-LK", {
        timeZone: "Asia/Colombo",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: true
      }).format(now);

      const dateText = new Intl.DateTimeFormat("en-LK", {
        timeZone: "Asia/Colombo",
        weekday: "short",
        day: "2-digit",
        month: "short",
        year: "numeric"
      }).format(now);

      document.getElementById("sl-time").textContent =
        timeText + " SLST";

      document.getElementById("sl-date").textContent =
        dateText + " · Sri Lanka";
    }

    updateSriLankaDateTime();
    window.setInterval(updateSriLankaDateTime, 1000);

    /* =========================================================
       USER LOCATION
    ========================================================= */

    function locateUser() {
      const button = document.getElementById("locate-button");

      if (!navigator.geolocation) {
        showToast("Geolocation is not supported by this device.");
        return;
      }

      button.disabled = true;
      button.innerHTML = "⏳ Locating";

      navigator.geolocation.getCurrentPosition(
        position => {
          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;

          userLocation = {
            latitude,
            longitude
          };

          if (userLocationMarker) {
            map.removeLayer(userLocationMarker);
          }

          const userIcon = L.divIcon({
            className: "",
            html:
              '<div class="user-location-marker">' +
                '<div class="user-location-pulse"></div>' +
                '<div class="user-location-dot"></div>' +
              "</div>",
            iconSize: [22, 22],
            iconAnchor: [11, 11],
            popupAnchor: [0, -12]
          });

          userLocationMarker = L.marker(
            [latitude, longitude],
            {
              icon: userIcon,
              keyboard: true,
              zIndexOffset: 2000
            }
          )
            .bindPopup(
              '<div style="padding:12px 14px">' +
                '<strong style="color:#1478ff">📍 Your Location</strong>' +
                '<div style="margin-top:6px;color:#a9b7cf;font-size:0.75rem">' +
                  "Accuracy: approximately " +
                  Math.round(position.coords.accuracy) +
                  " metres" +
                "</div>" +
              "</div>"
            )
            .addTo(map);

          map.flyTo(
            [latitude, longitude],
            16,
            {
              animate: true,
              duration: 1.2
            }
          );

          userLocationMarker.openPopup();

          button.disabled = false;
          button.innerHTML =
            '📍 <span class="full-label">My Location</span>';

          showToast("Your location was found.");
        },

        error => {
          const errorMessages = {
            1: "Location permission was denied.",
            2: "Your location is currently unavailable.",
            3: "The location request timed out."
          };

          button.disabled = false;
          button.innerHTML =
            '📍 <span class="full-label">My Location</span>';

          showToast(
            errorMessages[error.code] ||
            "Your location could not be found."
          );
        },

        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 30000
        }
      );
    }

    /* =========================================================
       GOOGLE SHEET DATA
    ========================================================= */

    function cleanText(value) {
      return String(value ?? "")
        .replace(/^\uFEFF/, "")
        .replace(/\s+/g, " ")
        .trim();
    }

    function normaliseKey(value) {
      return cleanText(value)
        .toLowerCase()
        .replace(/[^a-z0-9]/g, "");
    }

    function getCell(row, fieldName) {
      const aliases = COLUMN_ALIASES[fieldName] || [];
      const acceptedKeys = new Set(aliases.map(normaliseKey));

      for (const [columnName, value] of Object.entries(row)) {
        if (acceptedKeys.has(normaliseKey(columnName))) {
          return cleanText(value);
        }
      }

      return "";
    }

    function normaliseReportType(value) {
      const key = normaliseKey(value);

      const aliases = {
        overcrowding: "Overcrowding",
        overcrowded: "Overcrowding",
        crowding: "Overcrowding",
        crowd: "Overcrowding",

        delay: "Delay",
        delayed: "Delay",
        busdelay: "Delay",

        lostitem: "Lost Item",
        lostitems: "Lost Item",
        lostproperty: "Lost Item",

        misconduct: "Misconduct",
        driverconduct: "Misconduct",
        staffmisconduct: "Misconduct"
      };

      return aliases[key] || cleanText(value);
    }

    async function loadReports() {
      const thisRequest = ++loadRequestNumber;

      setRefreshStatus("loading");

      try {
        const separator = SHEET_CSV_URL.includes("?") ? "&" : "?";

        const response = await fetch(
          SHEET_CSV_URL +
          separator +
          "cache=" +
          Date.now(),
          {
            cache: "no-store",
            headers: {
              "Cache-Control": "no-cache"
            }
          }
        );

        if (!response.ok) {
          throw new Error(
            "Google Sheet request failed with status " +
            response.status
          );
        }

        const csvText = await response.text();

        const parsed = Papa.parse(csvText, {
          header: true,
          skipEmptyLines: "greedy",
          transformHeader: header => cleanText(header)
        });

        if (
          parsed.errors &&
          parsed.errors.length > 0 &&
          (!parsed.data || parsed.data.length === 0)
        ) {
          throw new Error(parsed.errors[0].message);
        }

        if (thisRequest !== loadRequestNumber) {
          return;
        }

        const validRows = parsed.data.filter(row =>
          getCell(row, "type")
        );

        clearReportLayers();
        resetReportCounts();

        const reportTasks = validRows.map(
          row => createReportFromRow(row, thisRequest)
        );

        await Promise.all(reportTasks);

        if (thisRequest !== loadRequestNumber) {
          return;
        }

        updateStatistics();
        applyActiveFilter();
        setRefreshStatus("live");
        hideLoadingOverlay();
      } catch (error) {
        console.error(error);

        setRefreshStatus("error");
        hideLoadingOverlay();
        showToast("The live Google Sheet could not be loaded.");
      }
    }

    async function createReportFromRow(row, requestNumber) {
      const type = normaliseReportType(
        getCell(row, "type")
      );

      if (!REPORT_CONFIG[type]) {
        return;
      }

      reportCounts.total += 1;
      reportCounts[type] += 1;

      const stopName = getCell(row, "stop");

      const latitude = Number.parseFloat(
        getCell(row, "latitude")
      );

      const longitude = Number.parseFloat(
        getCell(row, "longitude")
      );

      let coordinates = null;

      if (
        Number.isFinite(latitude) &&
        Number.isFinite(longitude) &&
        latitude !== 0 &&
        longitude !== 0
      ) {
        coordinates = [latitude, longitude];
      } else if (stopName) {
        coordinates = await geocodeLocation(stopName);
      }

      if (
        requestNumber !== loadRequestNumber ||
        !coordinates
      ) {
        return;
      }

      addReportMarker(row, type, coordinates);
    }

    function clearReportLayers() {
      Object.values(reportLayers).forEach(layer => {
        layer.clearLayers();
      });
    }

    function resetReportCounts() {
      reportCounts = {
        total: 0,
        Overcrowding: 0,
        Delay: 0,
        Misconduct: 0,
        "Lost Item": 0
      };
    }

    async function geocodeLocation(locationName) {
      const cacheKey = normaliseKey(locationName);

      if (geocodeCache.has(cacheKey)) {
        return geocodeCache.get(cacheKey);
      }

      try {
        const query =
          locationName + ", Colombo, Sri Lanka";

        const response = await fetch(
          "https://nominatim.openstreetmap.org/search" +
          "?format=json" +
          "&limit=1" +
          "&countrycodes=lk" +
          "&q=" +
          encodeURIComponent(query)
        );

        if (!response.ok) {
          throw new Error("Geocoding failed.");
        }

        const results = await response.json();

        if (results.length > 0) {
          const coordinates = [
            Number.parseFloat(results[0].lat),
            Number.parseFloat(results[0].lon)
          ];

          geocodeCache.set(cacheKey, coordinates);
          return coordinates;
        }
      } catch (error) {
        console.warn(
          "Location could not be geocoded:",
          locationName
        );
      }

      geocodeCache.set(cacheKey, null);
      return null;
    }

    /* =========================================================
       REPORT MARKERS AND POPUPS
    ========================================================= */

    function addReportMarker(row, type, coordinates) {
      const config = REPORT_CONFIG[type];

      const markerIcon = L.divIcon({
        className: "report-marker-wrap",
        html:
          '<div class="report-marker ' +
          config.className +
          '"></div>',
        iconSize: [28, 28],
        iconAnchor: [14, 14],
        popupAnchor: [0, -15]
      });

      const marker = L.marker(coordinates, {
        icon: markerIcon,
        keyboard: true,
        riseOnHover: true,
        riseOffset: 700
      });

      marker.bindPopup(
        createReportPopup(row, type),
        {
          maxWidth: 270,
          minWidth: 220,
          autoPan: true,
          autoPanPaddingTopLeft: [20, 100],
          autoPanPaddingBottomRight: [20, 115],
          closeButton: true
        }
      );

      reportLayers[type].addLayer(marker);
    }

    function createReportPopup(row, type) {
      const config = REPORT_CONFIG[type];

      const busRegistration =
        getCell(row, "busRegistration") ||
        "Not provided";

      const routeNumber =
        getCell(row, "route") ||
        "Not provided";

      const stopName =
        getCell(row, "stop") ||
        "Not provided";

      const crowding =
        getCell(row, "crowding");

      const delay =
        getCell(row, "delay");

      const description =
        getCell(row, "description");

      const reportTime =
        getCell(row, "incidentTime") ||
        getCell(row, "timestamp");

      const crowdingRow = crowding
        ? createPopupRow("Crowding level", crowding)
        : "";

      const delayRow = delay
        ? createPopupRow(
            "Delay duration",
            delay + " minutes"
          )
        : "";

      const descriptionRow = description
        ? createPopupRow("Details", description)
        : "";

      const timeRow = reportTime
        ? '<div class="popup-time">Reported: ' +
            escapeHtml(reportTime) +
          "</div>"
        : "";

      return (
        '<div class="report-popup">' +

          '<div class="report-popup-header" style="background:' +
            config.colour +
          '">' +
            config.icon +
            " " +
            escapeHtml(type) +
          "</div>" +

          '<div class="report-popup-body">' +

            '<div class="popup-primary">' +

              '<div class="popup-primary-box">' +
                '<div class="popup-primary-label">' +
                  "Bus registration" +
                "</div>" +
                '<div class="popup-primary-value">' +
                  escapeHtml(busRegistration) +
                "</div>" +
              "</div>" +

              '<div class="popup-primary-box">' +
                '<div class="popup-primary-label">' +
                  "Route number" +
                "</div>" +
                '<div class="popup-primary-value">' +
                  escapeHtml(routeNumber) +
                "</div>" +
              "</div>" +

            "</div>" +

            createPopupRow("Location", stopName) +
            crowdingRow +
            delayRow +
            descriptionRow +
            timeRow +

          "</div>" +

        "</div>"
      );
    }

    function createPopupRow(label, value) {
      return (
        '<div class="popup-row">' +
          '<span class="popup-label">' +
            escapeHtml(label) +
            ": " +
          "</span>" +
          escapeHtml(value) +
        "</div>"
      );
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(
        /[&<>'"]/g,
        character => {
          const entities = {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            "'": "&#39;",
            '"': "&quot;"
          };

          return entities[character];
        }
      );
    }

    /* =========================================================
       LIVE STATISTICS
    ========================================================= */

    function updateStatistics() {
      animateCount(
        document.getElementById("total-count"),
        reportCounts.total
      );

      animateCount(
        document.getElementById("overcrowding-count"),
        reportCounts.Overcrowding
      );

      animateCount(
        document.getElementById("delay-count"),
        reportCounts.Delay
      );

      animateCount(
        document.getElementById("misconduct-count"),
        reportCounts.Misconduct
      );

      animateCount(
        document.getElementById("lost-item-count"),
        reportCounts["Lost Item"]
      );

      updateFilterMessage();
    }

    function animateCount(element, targetValue) {
      const currentValue =
        Number.parseInt(element.textContent, 10) || 0;

      if (currentValue === targetValue) {
        element.textContent = targetValue;
        return;
      }

      const duration = 280;
      const startTime = performance.now();

      function updateAnimation(currentTime) {
        const progress = Math.min(
          (currentTime - startTime) / duration,
          1
        );

        const value = Math.round(
          currentValue +
          (targetValue - currentValue) * progress
        );

        element.textContent = value;

        if (progress < 1) {
          requestAnimationFrame(updateAnimation);
        }
      }

      requestAnimationFrame(updateAnimation);
    }

    /* =========================================================
       REPORT FILTERING
    ========================================================= */

    function filterReports(type) {
      activeFilter = type;
      applyActiveFilter();

      document
        .querySelectorAll(".stat-card")
        .forEach(card => {
          card.classList.toggle(
            "active",
            card.dataset.type === type
          );
        });
    }

    function applyActiveFilter() {
      Object.entries(reportLayers).forEach(
        ([type, layer]) => {
          const shouldShow =
            activeFilter === "all" ||
            activeFilter === type;

          if (shouldShow && !map.hasLayer(layer)) {
            map.addLayer(layer);
          }

          if (!shouldShow && map.hasLayer(layer)) {
            map.removeLayer(layer);
          }
        }
      );

      syncLayerCheckboxes();
      updateFilterMessage();
    }

    function updateFilterMessage() {
      const panel =
        document.getElementById("filter-message");

      const text =
        document.getElementById("filter-message-text");

      if (activeFilter === "all") {
        panel.classList.remove("visible");
        text.textContent = "Showing all reports";
        return;
      }

      const config = REPORT_CONFIG[activeFilter];
      const count = reportCounts[activeFilter] || 0;

      text.textContent =
        "Showing " +
        config.icon +
        " " +
        activeFilter +
        " (" +
        count +
        ")";

      panel.classList.add("visible");
    }

    /* =========================================================
       MAP LEGEND
    ========================================================= */

    const legendControl = L.control({
      position: "bottomright"
    });

    legendControl.onAdd = function () {
      const container = L.DomUtil.create(
        "div",
        "map-panel legend-control-container"
      );

      container.innerHTML =
        '<div class="map-panel-title">Report Types</div>' +

        createLegendRow(
          REPORT_CONFIG.Overcrowding.colour,
          "Overcrowding"
        ) +

        createLegendRow(
          REPORT_CONFIG.Delay.colour,
          "Delay"
        ) +

        createLegendRow(
          REPORT_CONFIG["Lost Item"].colour,
          "Lost Item"
        ) +

        createLegendRow(
          REPORT_CONFIG.Misconduct.colour,
          "Misconduct"
        ) +

        '<hr class="panel-separator">' +

        '<div class="legend-row">' +
          '<span class="legend-dot legend-stop-dot"></span>' +
          "<span>🚏 Bus Stop</span>" +
        "</div>" +

        '<div class="legend-row">' +
          '<span class="legend-dot legend-user-dot"></span>' +
          "<span>📍 Your Location</span>" +
        "</div>";

      L.DomEvent.disableClickPropagation(container);
      L.DomEvent.disableScrollPropagation(container);

      return container;
    };

    legendControl.addTo(map);

    function createLegendRow(colour, label) {
      return (
        '<div class="legend-row">' +
          '<span class="legend-dot" style="background:' +
            colour +
          '"></span>' +
          "<span>" +
            label +
          "</span>" +
        "</div>"
      );
    }

    /* =========================================================
       LAYER CONTROL
    ========================================================= */

    const layerControl = L.control({
      position: "topright"
    });

    layerControl.onAdd = function () {
      const container = L.DomUtil.create(
        "div",
        "map-panel filter-control-container"
      );

      container.innerHTML =
        '<div class="map-panel-title">Layers</div>' +

        createLayerCheckbox(
          "Overcrowding",
          "Overcrowding"
        ) +

        createLayerCheckbox(
          "Delay",
          "Delay"
        ) +

        createLayerCheckbox(
          "Lost Item",
          "Lost Item"
        ) +

        createLayerCheckbox(
          "Misconduct",
          "Misconduct"
        ) +

        '<hr class="panel-separator">' +

        '<label class="layer-row">' +
          '<input type="checkbox" id="bus-stops-checkbox" checked>' +
          "<span>🚏 Bus Stops</span>" +
        "</label>";

      L.DomEvent.disableClickPropagation(container);
      L.DomEvent.disableScrollPropagation(container);

      window.setTimeout(() => {
        Object.keys(reportLayers).forEach(type => {
          const checkbox =
            document.getElementById(
              getLayerCheckboxId(type)
            );

          if (checkbox) {
            checkbox.addEventListener(
              "change",
              event => {
                setReportLayerVisibility(
                  type,
                  event.target.checked
                );
              }
            );
          }
        });

        const busStopsCheckbox =
          document.getElementById(
            "bus-stops-checkbox"
          );

        if (busStopsCheckbox) {
          busStopsCheckbox.addEventListener(
            "change",
            event => {
              setBusStopsVisibility(
                event.target.checked
              );
            }
          );
        }
      }, 0);

      return container;
    };

    layerControl.addTo(map);

    function createLayerCheckbox(type, label) {
      return (
        '<label class="layer-row">' +
          '<input type="checkbox" id="' +
            getLayerCheckboxId(type) +
            '" checked>' +
          "<span>" +
            label +
          "</span>" +
        "</label>"
      );
    }

    function getLayerCheckboxId(type) {
      return (
        "layer-" +
        normaliseKey(type) +
        "-checkbox"
      );
    }

    function setReportLayerVisibility(type, visible) {
      const layer = reportLayers[type];

      if (visible && !map.hasLayer(layer)) {
        map.addLayer(layer);
      }

      if (!visible && map.hasLayer(layer)) {
        map.removeLayer(layer);
      }

      if (
        !visible &&
        activeFilter === type
      ) {
        filterReports("all");
      }
    }

    function setBusStopsVisibility(visible) {
      if (!busStopsLayer) {
        return;
      }

      if (visible && !map.hasLayer(busStopsLayer)) {
        map.addLayer(busStopsLayer);
      }

      if (!visible && map.hasLayer(busStopsLayer)) {
        map.removeLayer(busStopsLayer);
      }
    }

    function syncLayerCheckboxes() {
      Object.entries(reportLayers).forEach(
        ([type, layer]) => {
          const checkbox =
            document.getElementById(
              getLayerCheckboxId(type)
            );

          if (checkbox) {
            checkbox.checked = map.hasLayer(layer);
          }
        }
      );
    }

    /* =========================================================
       AUTOMATIC REFRESH
    ========================================================= */

    function startRefreshCountdown() {
      window.clearInterval(refreshTimer);

      refreshCountdown =
        REFRESH_INTERVAL_SECONDS;

      updateRefreshCountdownText();

      refreshTimer = window.setInterval(() => {
        refreshCountdown -= 1;
        updateRefreshCountdownText();

        if (refreshCountdown <= 0) {
          window.clearInterval(refreshTimer);

          loadReports().finally(() => {
            startRefreshCountdown();
          });
        }
      }, 1000);
    }

    function updateRefreshCountdownText() {
      document.getElementById(
        "refresh-countdown"
      ).textContent =
        refreshCountdown + "s";
    }

    async function manualRefresh() {
      window.clearInterval(refreshTimer);

      showToast("Refreshing live reports...");

      await loadReports();
      startRefreshCountdown();
    }

    function setRefreshStatus(status) {
      const dot =
        document.getElementById("live-dot");

      const label =
        document.getElementById("refresh-label");

      dot.classList.remove("loading");

      if (status === "loading") {
        dot.classList.add("loading");
        label.textContent = "Updating";
        return;
      }

      if (status === "error") {
        label.textContent = "Retry";
        return;
      }

      label.textContent = "Live";
    }

    /* =========================================================
       GOOGLE FORM
    ========================================================= */

    function openReportForm() {
      const formUrl = new URL(
        GOOGLE_FORM_URL
      );

      if (
        userLocation &&
        FORM_ENTRY_LATITUDE &&
        FORM_ENTRY_LONGITUDE
      ) {
        formUrl.searchParams.set(
          FORM_ENTRY_LATITUDE,
          userLocation.latitude.toFixed(7)
        );

        formUrl.searchParams.set(
          FORM_ENTRY_LONGITUDE,
          userLocation.longitude.toFixed(7)
        );
      }

      window.open(
        formUrl.toString(),
        "_blank",
        "noopener,noreferrer"
      );
    }

    /* =========================================================
       INTERFACE HELPERS
    ========================================================= */

    function hideLoadingOverlay() {
      const overlay =
        document.getElementById(
          "loading-overlay"
        );

      overlay.classList.add("hidden");

      window.setTimeout(() => {
        overlay.style.display = "none";
      }, 380);
    }

    function showToast(message) {
      const toast =
        document.getElementById("toast");

      window.clearTimeout(toastTimer);

      toast.textContent = message;
      toast.classList.add("visible");

      toastTimer = window.setTimeout(() => {
        toast.classList.remove("visible");
      }, 2800);
    }

    function refreshMapDimensions() {
      window.setTimeout(() => {
        map.invalidateSize({
          pan: false,
          animate: false
        });
      }, 120);

      window.setTimeout(() => {
        map.invalidateSize({
          pan: false,
          animate: false
        });
      }, 420);
    }

    window.addEventListener(
      "resize",
      refreshMapDimensions,
      {
        passive: true
      }
    );

    window.addEventListener(
      "orientationchange",
      refreshMapDimensions,
      {
        passive: true
      }
    );

    if (window.visualViewport) {
      window.visualViewport.addEventListener(
        "resize",
        refreshMapDimensions,
        {
          passive: true
        }
      );
    }

    window.addEventListener("focus", () => {
      manualRefresh();
      refreshMapDimensions();
    });

    document.addEventListener(
      "visibilitychange",
      () => {
        if (
          document.visibilityState ===
          "visible"
        ) {
          manualRefresh();
          refreshMapDimensions();
        }
      }
    );

    /* =========================================================
       START APPLICATION
    ========================================================= */

    loadReports().finally(() => {
      startRefreshCountdown();
      refreshMapDimensions();
    });
  </script>
</body>
</html>
